[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ansermail"
version = "0.1.0"
description = "The SDK for 鸿雁 / Anser: send and receive email through its HTTP API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []
keywords = ["anser", "email", "email-api", "transactional-email", "webhooks"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
  "Topic :: Communications :: Email",
]

[project.urls]
Homepage = "https://mail.ruoyulab.dev"
Documentation = "https://mail.ruoyulab.dev/docs/api"
Repository = "https://github.com/ruoyu-lab/ansermail-python"
Issues = "https://github.com/ruoyu-lab/ansermail-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ansermail"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
strict = true
files = ["src"]
